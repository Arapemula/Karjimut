name: Publish Karjimut to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Mandat wajib untuk PyPI Trusted Publishing (OIDC)
      contents: write # Diperlukan untuk membuat GitHub Release dan upload binary assets

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build binary wheel and sdist
        run: |
          cd sleep-mcp
          python -m build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sleep-mcp/dist/*.whl
            sleep-mcp/dist/*.tar.gz
          generate_release_notes: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sleep-mcp/dist/
