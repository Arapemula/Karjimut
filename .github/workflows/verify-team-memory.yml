name: Verify Karjimut Team Memory

on:
  pull_request:
    paths:
      - ".karjimut/**"
      - ".sleep-mcp/**"
      - ".github/workflows/verify-team-memory.yml"
  push:
    branches:
      - main
      - master
    paths:
      - ".karjimut/**"
      - ".sleep-mcp/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-team-memory:
    name: Schema, Injection & HMAC Signature Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Karjimut CLI
        run: |
          python -m pip install --upgrade pip
          pip install ./sleep-mcp

      - name: Run Team Memory Security Audit
        env:
          KARJIMUT_TEAM_SECRET: ${{ secrets.KARJIMUT_TEAM_SECRET }}
        run: |
          if [ -n "$KARJIMUT_TEAM_SECRET" ]; then
            echo "KARJIMUT_TEAM_SECRET is configured: enforcing strict HMAC-SHA256 verification."
            karjimut verify-team --target-dir . --strict
          else
            echo "KARJIMUT_TEAM_SECRET secret not configured: enforcing schema & prompt-injection audit."
            karjimut verify-team --target-dir .
          fi
