[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karjimut"
version = "2.0.6"
description = "The Autonomous Long-Term Memory Engine for AI Coding Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naufal Arhab Fadhil Muhammad" }
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "customtkinter>=5.2.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.9.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
karjimut = "karjimut.run:main"
sleep-mcp = "karjimut.run:main"

[tool.setuptools]
packages = [
    "karjimut",
    "karjimut.gui",
    "karjimut.assets",
    "karjimut.data",
    "karjimut.rules_template",
]
package-dir = {"karjimut" = "src"}

[tool.setuptools.package-data]
"karjimut" = [
    "assets/*.png",
    "assets/*.ico",
    "data/*.json",
    "rules_template/*.md",
    "rules_template/.cursorrules",
    ".env.example",
]
"karjimut.assets" = ["*.png", "*.ico"]
"karjimut.data" = ["*.json"]
"karjimut.rules_template" = ["*.md", ".cursorrules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
